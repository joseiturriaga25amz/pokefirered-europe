# B10 integrated-candidate pre-build gate. Source-only by design:
# no ARM compiler, real HGSS art fetch, ROM generation or artifact upload.
name: B10 Integrated Source Audit

on:
  push:
    branches:
      - diagnostic/b10-full-integrated-candidate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    name: Full + follower source contracts (no ROM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify Python tool syntax
        run: |
          python3 -m py_compile \
            tools/audit_follower_source_samples.py \
            tools/build_follower_diagnostic.py \
            tools/convert_follower_apng.py \
            tools/generate_follower_graphics.py \
            tools/validate_follower_graphics.py \
            tools/validate_follower_interaction.py

      - name: Verify follower A-button and friendship semantics
        run: python3 tools/validate_follower_interaction.py

      - name: Verify synthetic graphics conversion and registry contracts
        run: |
          python3 tools/convert_follower_apng.py --self-test
          python3 tools/generate_follower_graphics.py --self-test
          python3 tools/validate_follower_graphics.py --self-test
          python3 tools/build_follower_diagnostic.py --self-test

      - name: Preserve critical Full gameplay and follower ABI contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def source(name):
              return Path(name).read_text(encoding="utf-8")

          constants = source("include/constants/event_objects.h")
          movement = source("src/event_object_movement.c")
          avatar = source("src/field_control_avatar.c")
          summary = source("src/pokemon_summary_screen.c")
          follower = source("src/full_follower.c")
          builder = source("tools/build_follower_diagnostic.py")
          fieldmap = source("include/global.fieldmap.h")

          checks = {
              "8-bit dedicated graphics slot": (
                  "#define NUM_OBJ_EVENT_GFX     172" in constants
                  and "#define OBJ_EVENT_GFX_FULL_FOLLOWER NUM_OBJ_EVENT_GFX" in constants
                  and "#define OBJ_EVENT_GFX_VARS   240" in constants
                  and "u8 graphicsId;" in fieldmap
                  and "u16 graphicsId;" not in fieldmap
              ),
              "Full extra NPC icon palettes": all(
                  f"gMonIconPalettes[{i}]" in movement for i in range(3)
              ),
              "Full Surf HM possession and badge": (
                  "CheckBagHasItem(ITEM_HM03_SURF, 1)" in avatar
                  and "FLAG_BADGE05_GET" in avatar
              ),
              "Full numeric EV summary": (
                  "PrintFullEvSkillsPage();" in summary
                  and "sText_FullEvTotal" in summary
                  and "showFullEvView" in summary
              ),
              "Runtime-only follower graphics and objects": (
                  "OBJ_EVENT_ID_FULL_FOLLOWER 254" in source("include/full_follower.h")
                  and "RemoveFullFollowerObjectEvent(follower);" in follower
                  and "FullFollower_DiscardForLink();" in source("src/overworld.c")
                  and "FullFollower_OnCameraCoordsShift(dx, dy);" in movement
              ),
              "Private builder bound to candidate branch": (
                  'BRANCH = "diagnostic/b10-full-integrated-candidate"' in builder
                  and "git\", \"worktree\", \"add\"" in builder
                  and 'ROM_LIMIT = 32 * 1024 * 1024' in builder
              ),
          }
          for name, ok in checks.items():
              print(("PASS" if ok else "FAIL"), name)
          if not all(checks.values()):
              raise SystemExit("integrated source contract failed")
          PY


      # Exact source-only resource checks recovered from the original full
      # Follower Prototype workflow (not its private art/build stages).
      - name: Audit follower-owned field effect lifetime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          movement = Path("src/event_object_movement.c").read_text()
          effects = Path("src/field_effect_helpers.c").read_text()
          header = Path("include/field_effect_helpers.h").read_text()
          assert "void RemoveFullFollowerFieldEffects(const struct ObjectEvent *follower);" in header
          remove = movement.split("static void RemoveObjectEvent(struct ObjectEvent *objectEvent)\\n{".replace("\\n","\n"),1)[1].split("\n}",1)[0]
          assert remove.index("RemoveFullFollowerFieldEffects(objectEvent);") < remove.index("objectEvent->active = FALSE;")
          assert remove.index("objectEvent->active = FALSE;") < remove.index("RemoveObjectEventInternal(objectEvent);")
          guard = movement.split("void RemoveFullFollowerObjectEvent(struct ObjectEvent *objectEvent)\\n{".replace("\\n","\n"),1)[1].split("\n}",1)[0]
          assert "objectEvent->localId == OBJ_EVENT_ID_FULL_FOLLOWER" in guard
          assert "RemoveObjectEvent(objectEvent);" in guard
          cleanup = effects.split("void RemoveFullFollowerFieldEffects(const struct ObjectEvent *follower)\\n{".replace("\\n","\n"),1)[1]
          assert "if (!sprite->inUse)" in cleanup
          assert "sprite->data[0] == objectEventId" in cleanup
          assert "sprite->data[1] == follower->localId" in cleanup
          assert "sprite->inUse = FALSE;" in cleanup
          assert "(u8)(sprite->data[3] >> 8) == follower->localId" in cleanup
          assert "(u8)sprite->data[3] == follower->mapNum" in cleanup
          assert "(u8)sprite->data[4] == follower->mapGroup" in cleanup
          for callback, kind in (
              ("UpdateShadowFieldEffect", "FLDEFF_SHADOW"),
              ("UpdateShortGrassFieldEffect", "FLDEFF_SHORT_GRASS"),
              ("UpdateSandPileFieldEffect", "FLDEFF_SAND_PILE"),
              ("UpdateHotSpringsWaterFieldEffect", "FLDEFF_HOT_SPRINGS_WATER"),
              ("UpdateFeetInFlowingWaterFieldEffect", "FLDEFF_FEET_IN_FLOWING_WATER"),
              ("UpdateSplashFieldEffect", "FLDEFF_SPLASH"),
              ("UpdateTallGrassFieldEffect", "FLDEFF_TALL_GRASS"),
              ("UpdateLongGrassFieldEffect", "FLDEFF_LONG_GRASS"),
          ):
              assert "sprite->callback == " + callback in cleanup
              assert kind in cleanup
          assert "FlagSet(" not in cleanup
          # An old effect tied to the stable follower ID would otherwise
          # match a newly allocated object immediately after same-frame swap.
          old = {"local":254, "map":3, "group":7, "slot":5}
          new = {"local":254, "map":3, "group":7, "slot":5}
          assert all(old[k] == new[k] for k in old)
          print("Follower field-effect cleanup before reusable object slot teardown PASS")
          PY

      - name: Audit follower field-effect low-byte identity and reflection capacity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          effects = Path("src/field_effect_helpers.c").read_text()
          movement = Path("src/event_object_movement.c").read_text()
          effect_header = Path("include/field_effect.h").read_text()

          # ObjectEventGetLocalIdAndMap writes only u8 values to u32
          # gFieldEffectArguments. Native callbacks compare u8 IDs.
          assert "extern u32 gFieldEffectArguments[8];" in effect_header
          emit = movement.split("u32 StartFieldEffectForObjectEvent(", 1)[1].split("\n}", 1)[0]
          assert "(u8 *)&gFieldEffectArguments[0]" in emit
          assert "(u8 *)&gFieldEffectArguments[1]" in emit
          assert "(u8 *)&gFieldEffectArguments[2]" in emit

          cleanup = effects.split("void RemoveFullFollowerFieldEffects(", 1)[1]
          for index, name in enumerate(("localId", "mapNum", "mapGroup")):
              assert f"(u8)sprite->data[{index}] == follower->{name}" in cleanup
          assert "if (!sprite->inUse)" in cleanup
          assert "sprite->callback == UpdateObjectReflectionSprite" in cleanup
          assert "sprite->inUse = FALSE;" in cleanup

          # Reproduce stale upper bytes: a second object with the same
          # stable follower local ID must not inherit an old terrain sprite.
          saved = [0x12AB00FE, 0x90000105, 0xFEDC0003]
          fields = [254, 5, 3]
          dirty = [((v & ~0xff) | val) & 0xffff for v, val in zip(saved, fields)]
          assert dirty != fields
          assert [v & 0xff for v in dirty] == fields

          # Guard allocation failure before gSprites[spriteId] indexing.
          reflect = effects.split("void SetUpReflection(", 1)[1].split("\n}", 1)[0]
          create = reflect.index("reflectionSpriteId = CreateCopySpriteAt(")
          guard = reflect.index("if (reflectionSpriteId == MAX_SPRITES)")
          deref = reflect.index("reflectionSprite = &gSprites[reflectionSpriteId];")
          assert create < guard < deref
          assert re.search(r"if \(reflectionSpriteId == MAX_SPRITES\)\s*\{[^{}]*\breturn;\s*\}", reflect)
          assert "return MAX_SPRITES;" in movement.split("u8 CreateCopySpriteAt(", 1)[1].split("\n}", 1)[0]
          print("Low-byte ownership and exhausted reflection-sprite guard PASS")
          PY

      - name: Audit follower reflection recovery after sprite exhaustion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          helpers = Path("src/field_effect_helpers.c").read_text()
          movement = Path("src/event_object_movement.c").read_text()
          sprite_code = Path("src/sprite.c").read_text()
          header = Path("include/full_follower.h").read_text()
          assert '#include "full_follower.h"' in helpers
          assert '#define OBJ_EVENT_ID_FULL_FOLLOWER 254' in header
          reflection = helpers.split("void SetUpReflection(", 1)[1].split("\n}", 1)[0]
          match = re.search(r"if \(reflectionSpriteId == MAX_SPRITES\)\s*\{([^}]*)\}", reflection)
          assert match, "Reflection saturation must return before touching gSprites[MAX_SPRITES]"
          guard = match.group(1)
          assert "if (objectEvent->localId == OBJ_EVENT_ID_FULL_FOLLOWER)" in guard
          assert "objectEvent->hasReflection = FALSE;" in guard
          assert guard.index("if (objectEvent->localId == OBJ_EVENT_ID_FULL_FOLLOWER)") < guard.index("objectEvent->hasReflection = FALSE;")
          assert reflection.index("if (reflectionSpriteId == MAX_SPRITES)") < reflection.index("reflectionSprite = &gSprites[reflectionSpriteId];")
          flagger = movement.split("static void GetGroundEffectFlags_Reflection(struct ObjectEvent *objEvent, u32 *flags)\n{", 1)[1].split("\n}", 1)[0]
          assert "if (!objEvent->hasReflection)" in flagger
          assert "objEvent->hasReflection = 1;" in flagger
          allocator = movement.split("u8 CreateCopySpriteAt(", 1)[1].split("\n}", 1)[0]
          assert "return MAX_SPRITES;" in allocator
          assert "for (i = MAX_SPRITES - 1; i > -1; i--)" in allocator
          assert "if (!gSprites[i].inUse)" in allocator
          assert "#define MAX_SPRITES 64" in Path("include/sprite.h").read_text()

          # Boundary model tied to the verified native state-machine:
          # full slots -> follower flag reset, no invalid dereference;
          # capacity released -> next reflective step can create the copy.
          for filled in (0, 1, 62, 63, 64):
              has_reflection = True  # native pre-set flag
              if filled == 64:
                  has_reflection = False  # follower-only failed-create branch
              if filled == 64:
                  assert not has_reflection
                  filled -= 1  # a transient field-effect sprite finishes
                  assert not has_reflection  # native sees the missing reflection
                  has_reflection = True  # and retries on the next step
              assert has_reflection
          print("Follower reflection retry after capacity exhaustion PASS")
          PY

      - name: Audit dynamically allocated follower palette and reflection isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          movement = Path("src/event_object_movement.c").read_text()
          effects = Path("src/field_effect_helpers.c").read_text()
          follower = Path("src/full_follower.c").read_text()
          sprite = Path("src/sprite.c").read_text()
          header = Path("include/event_object_movement.h").read_text()
          pilot = Path("src/data/object_events/follower_pilot_graphics.h").read_text()
          assert "FullFollower_UsesPilotGraphics(void)" in follower
          assert "#define FOLLOWER_PILOT_PALETTE_TAG 0xF0A0" in pilot
          assert "OBJ_PALSLOT_COUNT" in header
          assert "for (i = gReservedSpritePaletteCount; i < 16; i++)" in sprite
          assert "followerPaletteNum = LoadSpritePalette(&palette);" in movement
          assert "if (followerPaletteNum == 0xFF)" in movement
          assert "ApplyGlobalFieldPaletteTint(followerPaletteNum);" in movement
          assert "objectEvent->active = FALSE;" in movement
          spawn = movement.split("static u8 TrySetupObjectEventSprite(", 1)[1].split("\nstatic u8 TrySpawnObjectEventTemplate(", 1)[0]
          assert spawn.index("LoadSpritePalette(&palette)") < spawn.index("CreateSprite(spriteTemplate, 0, 0, 0)")
          assert spawn.index("FreeSpritePaletteByTag(FOLLOWER_PILOT_PALETTE_TAG);") > spawn.index("if (spriteId == MAX_SPRITES)")
          assert "sprite->oam.paletteNum = followerPaletteNum != 0xFF ? followerPaletteNum : graphicsInfo->paletteSlot;" in spawn
          remove = movement.split("static void RemoveObjectEvent(struct ObjectEvent *objectEvent)\n{", 1)[1].split("\n}", 1)[0]
          assert remove.index("RemoveFullFollowerFieldEffects(objectEvent);") < remove.index("RemoveObjectEventInternal(objectEvent);") < remove.index("FreeSpritePaletteByTag(FOLLOWER_PILOT_PALETTE_TAG);")
          assert effects.count("!FullFollower_UsesPilotGraphics()") >= 2
          assert "reflectionSprite->oam.paletteNum = mainSprite->oam.paletteNum;" in effects
          assert effects.count("gReflectionEffectPaletteMap[") >= 2
          assert "reflectionSprite->oam.paletteNum = gReflectionEffectPaletteMap[mainSprite->oam.paletteNum];" in effects
          print("Dynamic follower palette allocation/release, NPC and reflection isolation PASS")
          PY

      - name: Audit 16 32 64 pixel follower diagnostic animation VRAM allocation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          gfx = Path("src/data/object_events/follower_pilot_graphics.h").read_text()
          movement = Path("src/event_object_movement.c").read_text()
          follower = Path("src/full_follower.c").read_text()
          sprite = Path("src/sprite.c").read_text()
          assert "FullFollower_UsesPilotGraphics()" in movement
          assert "|| sFollowerGraphicsId == OBJ_EVENT_GFX_SNORLAX" in follower
          assert "|| sFollowerGraphicsId == OBJ_EVENT_GFX_MEW" in follower
          assert "if (graphicsId == OBJ_EVENT_GFX_PIKACHU)" in movement
          assert "if (graphicsId == OBJ_EVENT_GFX_SNORLAX)" in movement
          assert "if (graphicsId == OBJ_EVENT_GFX_MEW)" in movement
          for px in (32, 64):
              frame_bytes = px * px // 2
              assert f"static const u32 sFollowerPilot{px}Pixels[16][{frame_bytes // 4}]" in gfx
              assert len(re.findall(
                  rf"\{{ \(const u8 \*\)sFollowerPilot{px}Pixels\[\d+\], {px} \* {px} / 2 \}}", gfx)) == 16
              assert f"&gObjectEventBaseOam_{px}x{px}" in gfx
              assert f"gObjectEventSpriteOamTables_{px}x{px}" in gfx
              for variant in ("Normal", "Shiny"):
                  block = gfx.split(
                      f"static const struct ObjectEventGraphicsInfo sFollowerPilot{px}{variant}Graphics = {{", 1
                  )[1].split("};", 1)[0]
                  assert f".size = {px} * {px} / 2" in block
                  assert f".width = {px}" in block and f".height = {px}" in block
                  assert f".images = sFollowerPilot{px}Images" in block
                  assert ".anims = sFollowerPilotAnims" in block
              for variant in ("Normal", "Shiny"):
                  assert f"&sFollowerPilot{px}{variant}Graphics" in movement
              assert frame_bytes in (512, 2048)
              assert frame_bytes // 32 <= 255
          # Gen III allocates a single frame from unreserved OBJ VRAM,
          # not 16 animation frames at once.
          assert "AllocSpriteTiles((u8)(sprite->images->size / TILE_SIZE_4BPP))" in sprite
          assert "spriteFrameImage.size = graphicsInfo->size" in movement
          assert "gSprites[gObjectEvents[objectEventId].spriteId].images = graphicsInfo->images" in movement
          print("Follower diagnostic 16/32/64 frame counts, shape, size and VRAM allocation contract PASS")
          PY

      - name: Audit follower National species graphics registry ABI and fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          g = Path("src/data/object_events/follower_pilot_graphics.h").read_text()
          m = Path("src/event_object_movement.c").read_text()
          f = Path("src/full_follower.c").read_text()
          h = Path("include/full_follower.h").read_text()
          c = Path("include/constants/event_objects.h").read_text()
          assert "#define FOLLOWER_GRAPHICS_SPECIES_COUNT 386" in g
          assert "sFollowerRegisteredGraphics[FOLLOWER_GRAPHICS_SPECIES_COUNT + 1][2]" in g
          assert "species > FOLLOWER_GRAPHICS_SPECIES_COUNT" in g
          assert "GetFollowerRegisteredGraphicsInfo(" in g
          assert "FullFollower_GetSpecies(void)" in f and "FullFollower_GetSpecies(void);" in h
          assert "FullFollower_GetSpecies(), FullFollower_IsShiny()" in m
          dispatch = m.split("if (graphicsId == OBJ_EVENT_GFX_FULL_FOLLOWER)", 1)[1].split(
              "if (graphicsId >= NUM_OBJ_EVENT_GFX)", 1)[0]
          assert dispatch.index("if (registered != NULL)") < dispatch.index("FullFollower_GetSpriteGraphicsId()")
          assert "#define OBJ_EVENT_GFX_FULL_FOLLOWER NUM_OBJ_EVENT_GFX" in c
          assert "u8 graphicsId;" in Path("include/global.fieldmap.h").read_text()
          print("National 386 species registry, shiny lookup and 8-bit fallback ABI PASS")
          PY


      # Original follower scene/link/QuestLog source assertions, checked
      # against the integrated Full candidate before any C/GBA build.
      - name: Audit follower graphics swap lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path("src/full_follower.c").read_text()
          cleanup = Path("src/event_object_movement.c").read_text()
          start = s.index("static void RefreshFollower(void)\n{")
          end = s.index("\nstatic void Task_FullFollower(", start)
          body = s[start:end]
          remove = body.index("RemoveFullFollowerObjectEvent(follower);", body.index("graphicsId = GetPrototypeFollowerGraphicsId(species);"))
          update_species = body.index("sFollowerSpecies = species;")
          update_graphics = body.index("sFollowerGraphicsId = graphicsId;")
          spawn = body.index("SpawnSpecialObjectEventParameterized(")
          assert remove < update_species < spawn and remove < update_graphics < spawn
          assert "sFollowerSpecies != species" in body
          assert "sFollowerGraphicsId != graphicsId" in body
          assert "follower = NULL;" in body[remove:update_species]
          assert "ObjectEventSetGraphicsId(" not in body
          assert "if (objectEventId >= OBJECT_EVENTS_COUNT)" in body
          assert "RemoveFullFollowerObjectEvent(follower);" in body[:body.index("graphicsId = GetPrototypeFollowerGraphicsId(species);")]
          assert "FlagSet(" not in cleanup[cleanup.index("void RemoveFullFollowerObjectEvent("):cleanup.index("static void RemoveObjectEventInternal(")]
          print("Follower sprite recreated on species change, old graphics cleaned up before slot switch")
          PY

      - name: Audit local/link/quest-log follower isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path("src/overworld.c").read_text()
          f = Path("src/full_follower.c").read_text()
          header = Path("include/full_follower.h").read_text()
          def implementation(name):
              # Require the opening brace to skip forward declarations.
              signature = "static bool32 " + name + "(u8 *state)\n{"
              start = s.index(signature)
              end = s.index("\nstatic ", start + len(signature))
              return s[start:end]
          local = implementation("ReturnToFieldLocal")
          link = implementation("ReturnToFieldLink")
          playback = implementation("LoadMap_QLPlayback")
          assert "ReloadObjectsAndRunReturnToFieldMapScript(TRUE);" in local
          assert "ReloadObjectsAndRunReturnToFieldMapScript(FALSE);" in link
          assert "ReloadObjectsAndRunReturnToFieldMapScript(FALSE);" in playback
          assert s.count("ReloadObjectsAndRunReturnToFieldMapScript(TRUE);") == 1
          assert s.count("ReloadObjectsAndRunReturnToFieldMapScript(FALSE);") == 2
          gate = s[s.index("static void ReloadObjectsAndRunReturnToFieldMapScript(bool8 allowFollower)\n{"):s.index("\nstatic void SetCameraToTrackPlayer(", s.index("static void ReloadObjectsAndRunReturnToFieldMapScript(bool8 allowFollower)\n{"))]
          assert "if (allowFollower)\n        FullFollower_OnLocalMapReady();" in gate
          resume = s[s.index("static void ResumeMap(bool32 inLink)\n{"):s.index("\nstatic void InitObjectEventsLink(", s.index("static void ResumeMap(bool32 inLink)\n{"))]
          assert resume.index("if (inLink || QL_IS_PLAYBACK_STATE)\n        FullFollower_DiscardForLink();") < resume.index("ResetSpriteData();")
          assert resume.index("else\n        FullFollower_DiscardForLocalReload();") < resume.index("ResetSpriteData();")
          assert "void FullFollower_DiscardForLink(void);" in header
          assert "void FullFollower_DiscardForLocalReload(void);" in header
          local = f[f.index("void FullFollower_DiscardForLocalReload(void)\n{"):f.index("\nvoid FullFollower_DiscardForLink(void)", f.index("void FullFollower_DiscardForLocalReload(void)\n{"))]
          discard = f[f.index("void FullFollower_DiscardForLink(void)\n{"):f.index("\nvoid FullFollower_OnLocalMapReady(void)", f.index("void FullFollower_DiscardForLink(void)\n{"))]
          assert "follower->active = FALSE;" in local
          assert "sFollowerSpecies = SPECIES_NONE;" in local and "sTrailCount = 0;" in local
          assert "sFollowerWarpTransition = FALSE;" not in local
          assert "sFollowerExitLockObserved = FALSE;" not in local
          assert "FullFollower_DiscardForLocalReload();" in discard
          assert "sFollowerWarpTransition = FALSE;" in discard
          assert "sFollowerExitLockObserved = FALSE;" in discard
          assert "DestroySprite(" not in local and "FlagSet(" not in local
          assert "DestroySprite(" not in discard and "FlagSet(" not in discard
          event = Path("src/event_object_movement.c").read_text()
          rebuild = event[event.index("void SpawnObjectEventsOnReturnToField(s16 x, s16 y)\n{"):event.index("\nstatic void SpawnObjectEventOnReturnToField(", event.index("void SpawnObjectEventsOnReturnToField(s16 x, s16 y)\n{"))]
          assert "if (gObjectEvents[i].active)" in rebuild
          assert resume.index("FullFollower_DiscardForLocalReload();") < resume.index("ResetSpriteData();")
          print("Local reload drops transient follower before sprite rebuild; link and Quest Log reset warp gate")
          PY

      - name: Audit follower Quest Log recording and playback isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f = Path("src/full_follower.c").read_text()
          e = Path("src/event_object_movement.c").read_text()
          q = Path("src/quest_log.c").read_text()
          constants = Path("include/constants/quest_log.h").read_text()
          assert '#include "quest_log.h"' in f
          suppress = f[f.index("static bool8 ShouldSuppressFollower(void)\n{"):f.index("\nstatic void PositionFollowerBehindPlayer(", f.index("static bool8 ShouldSuppressFollower(void)\n{"))]
          assert "if (QL_IS_PLAYBACK_STATE)\n        return TRUE;" in suppress
          assert "QL_IS_PLAYBACK_STATE" in constants
          refresh = f[f.index("static void RefreshFollower(void)\n{"):f.index("\nstatic void Task_FullFollower(", f.index("static void RefreshFollower(void)\n{"))]
          assert "if (ShouldSuppressFollower() || !sFollowerEnabled || species == SPECIES_NONE)" in refresh
          assert "RemoveFullFollowerObjectEvent(follower);" in refresh
          record = e[e.index("static void ObjectEventSetSingleMovement(struct ObjectEvent *objectEvent, struct Sprite *sprite, u8 movementActionId)\n{"):e.index("\nstatic void FaceDirection(", e.index("static void ObjectEventSetSingleMovement(struct ObjectEvent *objectEvent, struct Sprite *sprite, u8 movementActionId)\n{"))]
          assert "objectEvent->localId != OBJ_EVENT_ID_FULL_FOLLOWER" in record
          assert record.index("objectEvent->localId != OBJ_EVENT_ID_FULL_FOLLOWER") < record.index("QuestLogRecordNPCStep(")
          assert "sMovementScripts[OBJECT_EVENT_TEMPLATES_COUNT][2]" in q
          assert "sMovementScripts[sCurSceneActions[gQuestLogCurActionIdx].data.a.localId][0]" in q
          assert "MOVEMENT_TYPE_NONE" in f
          print("Follower ID excluded from recorded NPC steps and Quest Log playback")
          PY

      - name: Audit safe indoor follower spawn tile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f = Path("src/full_follower.c").read_text()
          event = Path("src/event_object_movement.c").read_text()
          start = f.index("static bool8 GetSafeFollowerSpawnCoords(s16 *x, s16 *y)\n{")
          end = f.index("\nstatic void PositionFollowerBehindPlayer(", start)
          body = f[start:end]
          assert "GetOppositeDirection(player->facingDirection)" in body
          assert "MoveCoords(direction, x, y);" in body
          assert "GetCollisionAtCoords(player, *x, *y, direction) == COLLISION_NONE" in body
          assert "DIR_SOUTH" in body and "DIR_EAST" in body
          start = f.index("static void RefreshFollower(void)\n{")
          end = f.index("\nstatic void Task_FullFollower(", start)
          refresh = f[start:end]
          guard = refresh.index("if (!GetSafeFollowerSpawnCoords(&spawnX, &spawnY))\n            return;")
          spawn = refresh.index("SpawnSpecialObjectEventParameterized(")
          pos = refresh.index("PositionFollowerBehindPlayer(follower, spawnX, spawnY);")
          assert guard < spawn < pos
          assert "if (objectEventId >= OBJECT_EVENTS_COUNT)\n            return;" in refresh
          assert "MoveObjectEventToMapCoords(follower, x, y);" in f
          collision = event[event.index("u8 GetCollisionAtCoords(struct ObjectEvent *objectEvent, s16 x, s16 y, u32 dir)\n{"):event.index("\nu8 GetCollisionFlagsAtCoords(",event.index("u8 GetCollisionAtCoords(struct ObjectEvent *objectEvent, s16 x, s16 y, u32 dir)\n{"))]
          assert "MapGridGetCollisionAt(x, y)" in collision
          assert "DoesObjectCollideWithObjectAt(objectEvent, x, y)" in collision
          assert "IsElevationMismatchAt(objectEvent->currentElevation, x, y)" in collision
          # No blanket MAP_TYPE_INDOOR rejection: approved policy allows safe interiors.
          assert "MAP_TYPE_INDOOR" not in body
          print("Follower spawns only on passable unoccupied tile, indoors allowed")
          PY

