name: Follower Prototype

on:
  push:
    branches:
      - prototype/follower-runtime

jobs:
  build:
    name: Build follower prototype
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Build firered_es_modern
        run: make -j2 firered_es_modern

      - name: Verify compatibility invariants
        run: |
          grep -q '#define OBJ_EVENT_ID_FULL_FOLLOWER 254' include/full_follower.h
          grep -q 'u8 graphicsId;' include/global.fieldmap.h
          grep -q 'struct Pokemon' include/pokemon.h
          grep -q 'MOVEMENT_TYPE_COPY_PLAYER' src/full_follower.c
          ! grep -q 'u16 graphicsId;' include/global.fieldmap.h
          ! grep -q 'graphics/object_events/pics/pokemon/bulbasaur.png' src/full_follower.c

      - name: Audit first-eligible lead identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path("src/full_follower.c").read_text()
          start = s.index("static u16 GetEligiblePrototypeFollowerSpecies(void)\\n{".replace("\\n", "\n"))
          end = s.index("\nstatic struct ObjectEvent *FindFollowerObject(void)", start)
          body = s[start:end]
          assert "species != SPECIES_NONE && hp != 0 && !isEgg" in body
          assert "if (GetPrototypeFollowerGraphicsId(species) == 0xFF)" in body
          assert body.index("return SPECIES_NONE;") < body.index("return species;")
          assert "MON_DATA_IS_EGG" in body and "MON_DATA_HP" in body
          print("Follower prototype party identity guard PASS")
          PY

      - name: Inventory native walking-frame coverage (informational)
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          graphics = Path("src/data/object_events/object_event_graphics.h").read_text()
          frames = Path("src/data/object_events/object_event_pic_tables.h").read_text()
          native = dict(re.findall(
              r'gObjectEventPic_(\w+)\[\] = INCBIN_U16\("graphics/object_events/pics/pokemon/([^"]+)\.4bpp"\)',
              graphics,
          ))
          frame_tables = dict(re.findall(
              r'sPicTable_(\w+)\[\] = \{(.*?)\n\};', frames, re.S,
          ))
          assert native, "No Pokémon overworld sheets found"
          missing = sorted(set(native) - set(frame_tables))
          assert not missing, f"Native Pokémon sheets missing graphics tables: {missing}"

          directional = 0
          frame_variation = 0
          direction_distinct_walk = 0
          static = 0
          for name in native:
              indices = [int(i) for i in re.findall(
                  r'overworld_frame\([^,]+,\s*\d+,\s*\d+,\s*(\d+)\)',
                  frame_tables[name],
              )]
              assert len(indices) >= 9, f"Invalid object-event frame table: {name}"
              if len(set(indices)) > 1:
                  directional += 1
              else:
                  static += 1
              # The standard FireRed table stores one neutral frame and two
              # alternating walk slots per facing direction. Direction poses
              # by themselves do not count as animated walking.
              walk_groups = ((0, 3, 4), (1, 5, 6), (2, 7, 8))
              groups = [frozenset(indices[j] for j in group) for group in walk_groups]
              if all(len(group) > 1 for group in groups):
                  frame_variation += 1
                  if len(set(groups)) == len(groups):
                      direction_distinct_walk += 1

          assert {"pikachu", "snorlax", "mew", "suicune", "pidgey", "spearow"} <= set(native.values())
          print(f"Native sheets: {len(native)}; directional poses: {directional}; single-pose sheets: {static}")
          print(f"Native sheets with any walking-frame variation in all three directions: {frame_variation}")
          print(f"Native sheets with direction-distinct animated walking groups: {direction_distinct_walk}")
          assert direction_distinct_walk <= frame_variation
          print("Required final scope: 386 species, fully animated; prototype inventory does not certify release readiness")
          PY

      - name: Verify species-indexed 8-bit graphics slot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          constants = Path("include/constants/event_objects.h").read_text()
          follower = Path("src/full_follower.c").read_text()
          movement = Path("src/event_object_movement.c").read_text()
          assert "#define OBJ_EVENT_GFX_FULL_FOLLOWER NUM_OBJ_EVENT_GFX" in constants
          assert "graphicsId = FullFollower_GetSpriteGraphicsId();" in movement
          assert "OBJ_EVENT_GFX_FULL_FOLLOWER,\n            MOVEMENT_TYPE_COPY_PLAYER" in follower
          assert "sFollowerSpecies != species" in follower
          assert "sFollowerGraphicsId != graphicsId" in follower
          assert "RemoveFullFollowerObjectEvent(follower);" in follower
          assert "ObjectEventSetGraphicsId(follower," not in follower
          assert "return SPECIES_NONE;" in follower
          print("Species-indexed follower slot and swap contract PASS")
          PY

      - name: Audit follower slot cleanup on ineligible lead
        run: |
          python3 - <<'PY'
          from pathlib import Path
          follower = Path("src/full_follower.c").read_text()
          movement = Path("src/event_object_movement.c").read_text()
          header = Path("include/event_object_movement.h").read_text()
          assert "if (!sFollowerEnabled || species == SPECIES_NONE || ShouldSuppressFollower())" in follower
          assert "RemoveFullFollowerObjectEvent(follower);" in follower
          assert "void RemoveFullFollowerObjectEvent(struct ObjectEvent *objectEvent);" in header
          start = movement.index("void RemoveFullFollowerObjectEvent(struct ObjectEvent *objectEvent)")
          end = movement.index("\nstatic void RemoveObjectEventInternal(", start)
          helper = movement[start:end]
          assert "objectEvent->active" in helper
          assert "objectEvent->localId == OBJ_EVENT_ID_FULL_FOLLOWER" in helper
          assert "RemoveObjectEvent(objectEvent);" in helper
          assert "FlagSet(" not in helper
          assert "RemoveObjectEventByLocalIdAndMap(" not in helper
          print("Runtime follower frees object slot without modifying event flags")
          PY

      - name: Audit follower graphics swap lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path("src/full_follower.c").read_text()
          cleanup = Path("src/event_object_movement.c").read_text()
          start = s.index("static void RefreshFollower(void)\n{")
          end = s.index("\nstatic void Task_FullFollower(", start)
          body = s[start:end]
          remove = body.index("RemoveFullFollowerObjectEvent(follower);", body.index("graphicsId = GetPrototypeFollowerGraphicsId(species);"))
          update_species = body.index("sFollowerSpecies = species;")
          update_graphics = body.index("sFollowerGraphicsId = graphicsId;")
          spawn = body.index("SpawnSpecialObjectEventParameterized(")
          assert remove < update_species < spawn and remove < update_graphics < spawn
          assert "sFollowerSpecies != species" in body
          assert "sFollowerGraphicsId != graphicsId" in body
          assert "follower = NULL;" in body[remove:update_species]
          assert "ObjectEventSetGraphicsId(" not in body
          assert "if (objectEventId >= OBJECT_EVENTS_COUNT)" in body
          assert "RemoveFullFollowerObjectEvent(follower);" in body[:body.index("graphicsId = GetPrototypeFollowerGraphicsId(species);")]
          assert "FlagSet(" not in cleanup[cleanup.index("void RemoveFullFollowerObjectEvent("):cleanup.index("static void RemoveObjectEventInternal(")]
          print("Follower sprite recreated on species change, old graphics cleaned up before slot switch")
          PY

      - name: Audit local/link/quest-log follower isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path("src/overworld.c").read_text()
          f = Path("src/full_follower.c").read_text()
          header = Path("include/full_follower.h").read_text()
          def implementation(name):
              # Require the opening brace to skip forward declarations.
              signature = "static bool32 " + name + "(u8 *state)\n{"
              start = s.index(signature)
              end = s.index("\nstatic ", start + len(signature))
              return s[start:end]
          local = implementation("ReturnToFieldLocal")
          link = implementation("ReturnToFieldLink")
          playback = implementation("LoadMap_QLPlayback")
          assert "ReloadObjectsAndRunReturnToFieldMapScript(TRUE);" in local
          assert "ReloadObjectsAndRunReturnToFieldMapScript(FALSE);" in link
          assert "ReloadObjectsAndRunReturnToFieldMapScript(FALSE);" in playback
          assert s.count("ReloadObjectsAndRunReturnToFieldMapScript(TRUE);") == 1
          assert s.count("ReloadObjectsAndRunReturnToFieldMapScript(FALSE);") == 2
          gate = s[s.index("static void ReloadObjectsAndRunReturnToFieldMapScript(bool8 allowFollower)\n{"):s.index("\nstatic void SetCameraToTrackPlayer(", s.index("static void ReloadObjectsAndRunReturnToFieldMapScript(bool8 allowFollower)\n{"))]
          assert "if (allowFollower)\n        FullFollower_OnLocalMapReady();" in gate
          resume = s[s.index("static void ResumeMap(bool32 inLink)\n{"):s.index("\nstatic void InitObjectEventsLink(", s.index("static void ResumeMap(bool32 inLink)\n{"))]
          assert resume.index("if (inLink || QL_IS_PLAYBACK_STATE)\n        FullFollower_DiscardForLink();") < resume.index("ResetSpriteData();")
          assert "void FullFollower_DiscardForLink(void);" in header
          discard = f[f.index("void FullFollower_DiscardForLink(void)\n{"):f.index("\nvoid FullFollower_OnLocalMapReady(void)", f.index("void FullFollower_DiscardForLink(void)\n{"))]
          assert "follower->active = FALSE;" in discard
          assert "sFollowerSpecies = SPECIES_NONE;" in discard
          assert "DestroySprite(" not in discard and "FlagSet(" not in discard
          print("Link return and quest-log replay suppress follower; pre-reset object cleared")
          PY

      - name: Audit follower sprite/OAM suppression and native graphics budget
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          f = Path("src/full_follower.c").read_text()
          e = Path("src/event_object_movement.c").read_text()
          gfx = Path("src/data/object_events/object_event_graphics_info.h").read_text()
          start = f.index("static void RefreshFollower(void)\n{")
          end = f.index("\nstatic void Task_FullFollower(", start)
          refresh = f[start:end]
          suppress = f[f.index("static bool8 ShouldSuppressFollower(void)\n{"):f.index("\nstatic void PositionFollowerBehindPlayer(", f.index("static bool8 ShouldSuppressFollower(void)\n{"))]
          guard = "if (!sFollowerEnabled || species == SPECIES_NONE || ShouldSuppressFollower())"
          assert guard in refresh
          early = refresh[refresh.index(guard):refresh.index("graphicsId = GetPrototypeFollowerGraphicsId(species);")]
          assert "RemoveFullFollowerObjectEvent(follower);" in early
          assert "sFollowerSpecies = SPECIES_NONE;" in early
          assert "return;" in early
          assert "ScriptContext_IsEnabled()" in suppress
          assert "PLAYER_AVATAR_FLAG_SURFING" in suppress
          assert "PLAYER_AVATAR_FLAG_MACH_BIKE" in suppress
          assert "PLAYER_AVATAR_FLAG_ACRO_BIKE" in suppress
          assert "sFollowerSpecies == SPECIES_NONE" not in suppress
          assert "gSprites[follower->spriteId].invisible =" not in refresh
          assert "UpdateObjEventSpriteVisibility(objectEvent, sprite);" in e
          assert "sprite->invisible = TRUE;" in e[e.index("static void UpdateObjEventSpriteVisibility(struct ObjectEvent *objectEvent, struct Sprite *sprite)\n{"):]
          names = ("Pikachu", "Snorlax", "Mew", "Suicune", "Pidgey", "Spearow")
          for name in names:
              m = re.search(r"const struct ObjectEventGraphicsInfo gObjectEventGraphicsInfo_" + name + r" = \{(.*?)\n\};", gfx, re.S)
              assert m, f"Missing native graphics info: {name}"
              data = m.group(1)
              size = int(re.search(r"\.size = (\d+)", data).group(1))
              width = int(re.search(r"\.width = (\d+)", data).group(1))
              height = int(re.search(r"\.height = (\d+)", data).group(1))
              assert size == width * height // 2, (name, size, width, height)
              assert (width, height) in ((16, 16), (32, 32)), (name, width, height)
              assert re.search(r"\.paletteSlot = PALSLOT_NPC_[1-4],", data), name
              assert re.search(r"\.paletteTag = OBJ_EVENT_PAL_TAG_NPC_(BLUE|PINK|GREEN|WHITE),", data), name
              print(f"{name}: {width}x{height}, {size // 32} 4bpp tiles, standard shared NPC palette")
          assert "if (spriteId == MAX_SPRITES)" in e
          assert "if (objectEventId >= OBJECT_EVENTS_COUNT)" in refresh
          print("Suppression frees runtime object; visibility remains engine-owned; native 6-species budget PASS")
          PY

      - name: Audit follower Quest Log recording and playback isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f = Path("src/full_follower.c").read_text()
          e = Path("src/event_object_movement.c").read_text()
          q = Path("src/quest_log.c").read_text()
          constants = Path("include/constants/quest_log.h").read_text()
          assert '#include "quest_log.h"' in f
          suppress = f[f.index("static bool8 ShouldSuppressFollower(void)\n{"):f.index("\nstatic void PositionFollowerBehindPlayer(", f.index("static bool8 ShouldSuppressFollower(void)\n{"))]
          assert "if (QL_IS_PLAYBACK_STATE)\n        return TRUE;" in suppress
          assert "QL_IS_PLAYBACK_STATE" in constants
          refresh = f[f.index("static void RefreshFollower(void)\n{"):f.index("\nstatic void Task_FullFollower(", f.index("static void RefreshFollower(void)\n{"))]
          assert "species == SPECIES_NONE || ShouldSuppressFollower()" in refresh
          assert "RemoveFullFollowerObjectEvent(follower);" in refresh
          record = e[e.index("static void ObjectEventSetSingleMovement(struct ObjectEvent *objectEvent, struct Sprite *sprite, u8 movementActionId)\n{"):e.index("\nstatic void FaceDirection(", e.index("static void ObjectEventSetSingleMovement(struct ObjectEvent *objectEvent, struct Sprite *sprite, u8 movementActionId)\n{"))]
          assert "objectEvent->localId != OBJ_EVENT_ID_FULL_FOLLOWER" in record
          assert record.index("objectEvent->localId != OBJ_EVENT_ID_FULL_FOLLOWER") < record.index("QuestLogRecordNPCStep(")
          assert "sMovementScripts[OBJECT_EVENT_TEMPLATES_COUNT][2]" in q
          assert "sMovementScripts[sCurSceneActions[gQuestLogCurActionIdx].data.a.localId][0]" in q
          assert "MOVEMENT_TYPE_COPY_PLAYER" in f
          print("Follower ID excluded from recorded NPC steps and Quest Log playback")
          PY

      - name: Audit safe indoor follower spawn tile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f = Path("src/full_follower.c").read_text()
          event = Path("src/event_object_movement.c").read_text()
          start = f.index("static bool8 GetSafeFollowerSpawnCoords(s16 *x, s16 *y)\n{")
          end = f.index("\nstatic void PositionFollowerBehindPlayer(", start)
          body = f[start:end]
          assert "GetOppositeDirection(player->facingDirection)" in body
          assert "MoveCoords(direction, x, y);" in body
          assert "GetCollisionAtCoords(player, *x, *y, direction) == COLLISION_NONE" in body
          assert "DIR_SOUTH" in body and "DIR_EAST" in body
          start = f.index("static void RefreshFollower(void)\n{")
          end = f.index("\nstatic void Task_FullFollower(", start)
          refresh = f[start:end]
          guard = refresh.index("if (!GetSafeFollowerSpawnCoords(&spawnX, &spawnY))\n            return;")
          spawn = refresh.index("SpawnSpecialObjectEventParameterized(")
          pos = refresh.index("PositionFollowerBehindPlayer(follower, spawnX, spawnY);")
          assert guard < spawn < pos
          assert "if (objectEventId >= OBJECT_EVENTS_COUNT)\n            return;" in refresh
          assert "MoveObjectEventToMapCoords(follower, x, y);" in f
          collision = event[event.index("u8 GetCollisionAtCoords(struct ObjectEvent *objectEvent, s16 x, s16 y, u32 dir)\n{"):event.index("\nu8 GetCollisionFlagsAtCoords(",event.index("u8 GetCollisionAtCoords(struct ObjectEvent *objectEvent, s16 x, s16 y, u32 dir)\n{"))]
          assert "MapGridGetCollisionAt(x, y)" in collision
          assert "DoesObjectCollideWithObjectAt(objectEvent, x, y)" in collision
          assert "IsElevationMismatchAt(objectEvent->currentElevation, x, y)" in collision
          # No blanket MAP_TYPE_INDOOR rejection: approved policy allows safe interiors.
          assert "MAP_TYPE_INDOOR" not in body
          print("Follower spawns only on passable unoccupied tile, indoors allowed")
          PY

      - name: Audit Quest Log follower task gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f = Path("src/full_follower.c").read_text()
          s = Path("src/overworld.c").read_text()
          start = f.index("void FullFollower_OnLocalMapReady(void)\n{")
          ready = f[start:]
          assert ready.index("if (QL_IS_PLAYBACK_STATE)\n        return;") < ready.index("CreateTask(")
          begin = s.index("static void ResumeMap(bool32 inLink)\n{")
          resume = s[begin:s.index("\nstatic void InitObjectEventsLink(", begin)]
          assert resume.index("if (inLink || QL_IS_PLAYBACK_STATE)") < resume.index("ResetSpriteData();")
          print("Quest Log follower excluded before sprite reset and task creation")
          PY

      - name: Audit follower cardinal movement mapping
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          follower = Path("src/full_follower.c").read_text()
          movement = Path("src/event_object_movement.c").read_text()
          start = follower.index("static void PositionFollowerBehindPlayer(struct ObjectEvent *follower, s16 x, s16 y)\n{")
          end = follower.index("\nstatic void RefreshFollower(", start)
          position = follower[start:end]
          assert "follower->directionSequenceIndex = DIR_NORTH;" in position
          assert "PositionFollowerBehindPlayer(follower, spawnX, spawnY);" in follower
          step0 = movement[movement.index("static bool8 MovementType_CopyPlayer_Step0(struct ObjectEvent *objectEvent, struct Sprite *sprite)\n{"):movement.index("\nstatic bool8 MovementType_CopyPlayer_Step1(", movement.index("static bool8 MovementType_CopyPlayer_Step0(struct ObjectEvent *objectEvent, struct Sprite *sprite)\n{"))]
          assert "if (objectEvent->directionSequenceIndex == 0)" in step0
          assert "objectEvent->directionSequenceIndex = GetPlayerFacingDirection();" in step0
          assert "MOVEMENT_TYPE_COPY_PLAYER" in follower
          def parse_table(name):
              start = movement.index("static const u8 " + name + "[][4] = {")
              end = movement.index("\n};", start)
              rows = re.findall(r"\{\s*([1-4])\s*,\s*([1-4])\s*,\s*([1-4])\s*,\s*([1-4])\s*\}", movement[start:end])
              assert len(rows) == 4, (name, rows)
              return [tuple(map(int, row)) for row in rows]
          player = parse_table("sPlayerDirectionsForCopy")
          copied = parse_table("sPlayerDirectionToCopyDirection")
          north = 2
          # Verified from native rotation tables: neutral NORTH/NORTH gives
          # an absolute cardinal copy regardless of the player's facing at spawn.
          for direction in range(1, 5):
              rotated = player[north - 1][direction - 1]
              result = copied[north - 1][rotated - 1]
              assert result == direction, (direction, result)
          # The old initial-facing choice was not a literal trailing movement.
          for facing in (1, 3, 4):
              rotated = player[facing - 1][facing - 1]
              result = copied[north - 1][rotated - 1]
              assert result != facing, (facing, result)
          print("Follower copies all four absolute directions; no initial-facing rotation")
          PY
