      - name: Compile temporary ROM with all 386 real HGSS follower normal-shiny bindings
        run: |
          set -euo pipefail
          python3 tools/generate_follower_graphics.py --self-test
          PYTHONPATH=tools python3 - <<'PY'
          from pathlib import Path
          import io
          import tempfile
          import zipfile
          from audit_follower_source_samples import download_archive
          from generate_follower_graphics import install
          from convert_follower_apng import DIRECTIONS

          source = download_archive()
          with tempfile.TemporaryDirectory() as root:
              root = Path(root)
              ids = set(range(1, 387))  # Complete Gen I-III National Dex, including 64px and shiny
              count = 0
              with zipfile.ZipFile(io.BytesIO(source)) as zf:
                  for entry in zf.infolist():
                      parts = entry.filename.split("/")
                      if len(parts) == 7 and parts[1:3] == ["APNG", "by-pokemon"]:
                          if parts[3][:3].isdigit() and int(parts[3][:3]) in ids:
                              if parts[4] in ("regular", "shiny") and parts[5] in DIRECTIONS and parts[6] == "":
                                  raise ValueError("unexpected asset directory encoding")
                      if len(parts) == 6 and parts[1:3] == ["APNG", "by-pokemon"]:
                          name, variant, png = parts[3], parts[4], parts[5]
                          if name[:3].isdigit() and int(name[:3]) in ids and variant in ("regular", "shiny") and png in tuple(d + ".png" for d in DIRECTIONS):
                              dest = root / name / variant / png
                              dest.parent.mkdir(parents=True, exist_ok=True)
                              dest.write_bytes(zf.read(entry))
                              count += 1
              assert count == len(ids) * 2 * len(DIRECTIONS), count
              install(root, Path("."), sorted(ids))
          PY
          make -j2 firered_es_modern
          git diff --stat -- src/data/object_events/follower_pilot_graphics.h
          test -s pokefirered_modern_es.gba
          test "$(stat -c %s pokefirered_modern_es.gba)" -le 33554432
          echo "Full 386 real-source normal/shiny follower graphics compiled into a <=32 MiB test ROM; no ROM or sprites uploaded."

