      - name: Audit warp recall through entrance unlock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path("include/full_follower.h").read_text()
          f=Path("src/full_follower.c").read_text()
          t=Path("src/field_fadetransition.c").read_text()
          script=Path("src/script.c").read_text()
          assert "void FullFollower_RecallForWarp(void);" in h
          assert "sLockFieldControls = TRUE;" in script and "sLockFieldControls = FALSE;" in script
          assert "bool8 ArePlayerFieldControlsLocked(void)" in script
          def function(src,signature):
              start=src.index(signature+"\n{")
              end=src.index("\n}",start)
              return src[start:end]
          suppress=function(f,"static bool8 ShouldSuppressFollower(void)")
          for item in ("if (sFollowerWarpTransition)", "sFollowerExitLockObserved = TRUE;", "if (!sFollowerExitLockObserved || ArePlayerFieldControlsLocked())", "sFollowerWarpTransition = FALSE;", "if (ArePlayerFieldControlsLocked())\n        return TRUE;", "if (ScriptContext_IsEnabled())"):
              assert item in suppress,item
          recall=function(f,"void FullFollower_RecallForWarp(void)")
          for item in ("sFollowerWarpTransition = TRUE;", "sFollowerExitLockObserved = FALSE;", "RemoveFullFollowerObjectEvent(follower);", "sFollowerSpecies = SPECIES_NONE;", "sTrailCount = 0;"):
              assert item in recall,item
          entries=["DoWarp(void)","DoDiveWarp(void)","DoDoorWarp(void)","DoTeleport2Warp(void)","DoUnionRoomWarp(void)","DoEscalatorWarp(u8 metatileBehavior)","DoLavaridgeGymB1FWarp(void)","DoLavaridgeGym1FWarp(void)","DoTeleportWarp(void)","DoCableClubWarp(void)","DoStairWarp(u16 metatileBehavior, u16 delay)"]
          for entry in entries:
              body=function(t,"void "+entry)
              assert body.count("FullFollower_RecallForWarp();")==1,entry
              for op in ("LockPlayerFieldControls();","Task_StairWarp(taskId);","StartEscalatorWarp(","StartLavaridgeGym"):
                  if op in body:
                      assert body.index("FullFollower_RecallForWarp();") < body.index(op),entry
          assert "DoDiveWarp();\n    gFieldCallback = FieldCB_FallWarpExit;" in t
          ready=function(f,"void FullFollower_OnLocalMapReady(void)")
          assert "if (sFollowerWarpTransition)\n        sFollowerExitLockObserved = FALSE;" in ready
          assert "CreateTask(Task_FullFollower, FOLLOWER_TASK_PRIORITY);" in ready
          assert "RefreshFollower();" not in ready
          assert ready.index("if (QL_IS_PLAYBACK_STATE)") < ready.index("CreateTask(Task_FullFollower")
          # Both normal warp loads and local returns invoke the follower hook
          # before the field callback acquires its entrance-control lock.
          world=Path("src/overworld.c").read_text()
          mapload=function(world,"static bool32 LoadMapInStepsLocal(u8 *state, bool32 inLink)")
          assert mapload.index("InitObjectEventsLocal();") < mapload.index("if (RunFieldCallback())")
          initobj=function(world,"static void InitObjectEventsLocal(void)")
          assert "FullFollower_OnLocalMapReady();" in initobj
          returnlocal=function(world,"static bool32 ReturnToFieldLocal(u8 *state)")
          assert returnlocal.index("ReloadObjectsAndRunReturnToFieldMapScript(TRUE);") < returnlocal.index("if (RunFieldCallback())")
          reload=function(world,"static void ReloadObjectsAndRunReturnToFieldMapScript(bool8 allowFollower)")
          assert "if (allowFollower)\n        FullFollower_OnLocalMapReady();" in reload
          # Task callback alone may create or move the follower after the
          # field callback runs, preventing premature sprite allocation.
          task=function(f,"static void Task_FullFollower(u8 taskId)")
          assert "RefreshFollower();" in task
          refresh=function(f,"static void RefreshFollower(void)")
          assert "if (ShouldSuppressFollower() || !sFollowerEnabled || species == SPECIES_NONE)" in refresh
          assert refresh.index("ShouldSuppressFollower()") < refresh.index("species == SPECIES_NONE")
          # Even an unsupported/fainted lead must advance the destination lock gate.
          # The player's later party change must not resurrect an old transition.
          for lead_eligible in (False, True):
              pending,seen=True,False
              for locked in (False, True, True, False):
                  if pending:
                      if locked: seen=True
                      if seen and not locked: pending,seen=False,False
              assert not pending,lead_eligible
          discard=function(f,"void FullFollower_DiscardForLink(void)")
          assert "sFollowerWarpTransition = FALSE;" in discard
          assert "sFollowerExitLockObserved = FALSE;" in discard
          # Destination loads before field callback starts its entrance lock:
          # never respawn in that transient unlocked frame.
          pending,seen=True,False
          def gate(locked):
              global pending,seen
              if pending:
                  if locked: seen=True
                  if not seen or locked: return True
                  pending=False;seen=False
              return locked
          assert gate(False) is True
          assert gate(True) is True
          assert gate(True) is True
          assert gate(False) is False
          assert pending is False
          print("Entrances recall immediately; no respawn until observed lock release")
          PY
