          pokemon_h = Path("include/pokemon.h").read_text()
          assert "#define SPECIES_TREECKO 277" in species
          # National Dex IDs are enum positions, not #define constants.
          assert "NATIONAL_DEX_CELEBI,\n    // Hoenn\n    NATIONAL_DEX_TREECKO," in pokedex
          assert "u16 SpeciesToNationalPokedexNum(u16 species);" in pokemon_h
          getter = follower.split("u16 FullFollower_GetSpecies(void)\n{",1)[1].split("\n}",1)[0]
          assert "sFollowerSpecies == SPECIES_NONE" in getter
          assert "return SpeciesToNationalPokedexNum(sFollowerSpecies);" in getter
          guard = follower.split("static u8 GetPrototypeFollowerGraphicsId(u16 species)\n{",1)[1].split("\n}",1)[0]
          assert "FullFollower_HasRegisteredGraphics(SpeciesToNationalPokedexNum(species))" in guard
          assert "bool8 FullFollower_HasRegisteredGraphics(u16 nationalDexNum)" in movement
          assert "bool8 FullFollower_HasRegisteredGraphics(u16 nationalDexNum);" in header
          assert "GetFollowerRegisteredGraphicsInfo(nationalDexNum, FALSE) != NULL" in movement
          assert "GetFollowerRegisteredGraphicsInfo(nationalDexNum, TRUE) != NULL" in movement
          assert "FullFollower_HasRegisteredGraphics(FullFollower_GetSpecies())" in follower
          print("Gen III internal species 277 != National Dex 252; registered follower maps safely PASS")
          PY

