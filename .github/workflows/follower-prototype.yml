          # field callback runs, preventing premature sprite allocation.
          task=function(f,"static void Task_FullFollower(u8 taskId)")
          assert "RefreshFollower();" in task
          refresh=function(f,"static void RefreshFollower(void)")
          assert "if (ShouldSuppressFollower() || !sFollowerEnabled || species == SPECIES_NONE)" in refresh
