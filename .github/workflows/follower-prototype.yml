# TEMPORARY B10 source-only audit on an isolated branch.
# The canonical prototype/follower-runtime workflow is unchanged.
# This audit workflow has no ARM toolchain, sprites, or GBA ROM build.
name: B10 Source Interaction Audit

on:
  push:
    branches:
      - audit/b10-friendship-validator

jobs:
  interaction:
    name: Python friendship and A-button source checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python syntax only
        run: python3 -m py_compile tools/validate_follower_interaction.py
      - name: Check all friendship tiers, interaction, scripts and five regressions
        run: python3 tools/validate_follower_interaction.py
