name: Full Production Block 2

on:
  push:
    branches:
      - feature/save-bag-namespaces
  pull_request:
    branches:
      - master

jobs:
  spanish-modern:
    name: Build Spanish modern + Full header invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Build firered_es_modern
        run: make -j2 firered_es_modern

      - name: Verify vanilla bag remains unchanged
        run: |
          grep -q '#define BAG_ITEMS_COUNT      42' include/constants/global.h
          grep -q 'u8 unused_348C\[400\]' include/global.h
          grep -q 'gBagPockets\[POCKET_ITEMS - 1\].itemSlots = gSaveBlock1Ptr->bagPocket_Items;' src/item.c
          grep -q 'gBagPockets\[POCKET_ITEMS - 1\].capacity = BAG_ITEMS_COUNT;' src/item.c
          ! grep -q 'BAG_ITEMS_FULL_COUNT' include/constants/global.h
          ! grep -q 'bagPocket_ItemsExtra' include/global.h
          ! grep -q 'GetFullBagItemSlots' src/load_save.c

      - name: Verify Full header architecture
        run: |
          grep -q 'struct FullSaveHeader' include/global.h
          grep -q 'struct FullSaveHeader fullHeader' include/global.h
          grep -q 'SaveBlock1SizeMustRemainVanilla' include/global.h
          grep -q 'FullHeaderOffset' include/global.h
          grep -q "static const u8 sFullSaveMagic\[4\] = {'R', 'F', 'F', 'L'};" src/load_save.c
          grep -q '#define FULL_SAVE_SCHEMA_VERSION 1' src/load_save.c
          grep -q 'InitFullSaveData();' src/new_game.c
          grep -q 'InitFullSaveData();' src/save.c

      - name: Verify Full persistent namespaces
        run: |
          grep -q 'FLAG_FULL_START' include/constants/flags.h
          grep -q 'FLAG_FULL_END' include/constants/flags.h
          grep -q 'VAR_FULL_START' include/constants/vars.h
          grep -q 'VAR_FULL_END' include/constants/vars.h

      - name: Record ROM checksum
        run: sha1sum pokefirered_modern_es.gba

  schema-model:
    name: Validate reduced Full save schema model
    runs-on: ubuntu-latest
    steps:
      - name: Model reduced schema
        run: |
          python3 - <<'PY'
          SAVE_SIZE = 0x3D68
          HEADER_START = 0x3D24
          HEADER_END = 0x3D34
          BAG_UNUSED_START = 0x348C
          BAG_UNUSED_END = 0x361C

          assert HEADER_END - HEADER_START == 16
          assert BAG_UNUSED_END - BAG_UNUSED_START == 400
          assert HEADER_END <= SAVE_SIZE
          assert BAG_UNUSED_END <= SAVE_SIZE
          assert not (HEADER_START < BAG_UNUSED_END and BAG_UNUSED_START < HEADER_END)

          original = bytearray((i * 37 + 11) & 0xFF for i in range(SAVE_SIZE))
          migrated = bytearray(original)

          migrated[HEADER_START:HEADER_END] = b'\x00' * 16
          migrated[HEADER_START:HEADER_START+4] = b'RFFL'
          migrated[HEADER_START+4:HEADER_START+6] = (1).to_bytes(2, 'little')

          for i, (before, after) in enumerate(zip(original, migrated)):
              if not (HEADER_START <= i < HEADER_END):
                  assert before == after, hex(i)

          # Specifically prove the former bag-extension region is untouched.
          assert migrated[BAG_UNUSED_START:BAG_UNUSED_END] == original[BAG_UNUSED_START:BAG_UNUSED_END]

          print('Reduced Full save schema model PASS')
          PY

  package-myboy:
    name: Package Block 2 MyBoy production patch
    needs:
      - spanish-modern
      - schema-model
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          path: modified

      - name: Checkout frozen Spanish baseline
        uses: actions/checkout@v4
        with:
          ref: e184c5cf898cd29efebd33bc1bfe5994277e21ab
          path: vanilla

      - name: Checkout agbcc for baseline
        uses: actions/checkout@v4
        with:
          repository: pret/agbcc
          path: vanilla/agbcc

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Install agbcc in baseline tree
        working-directory: vanilla/agbcc
        run: |
          ./build.sh
          ./install.sh ../

      - name: Build and verify Spanish vanilla base
        working-directory: vanilla
        run: make -j2 compare_firered_es

      - name: Build production Block 2 ROM
        working-directory: modified
        run: make -j2 firered_es_modern

      - name: Create IPS patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          base = Path("vanilla/pokefirered_es.gba").read_bytes()
          target = Path("modified/pokefirered_modern_es.gba").read_bytes()
          out = Path("Pokemon_Rojo_Fuego_Full_Block2_PRODUCCION.ips")

          patch = bytearray(b"PATCH")
          i = 0
          limit = max(len(base), len(target))

          while i < limit:
              b = base[i] if i < len(base) else 0
              t = target[i] if i < len(target) else 0
              if b == t:
                  i += 1
                  continue

              start = i
              while i < limit:
                  b = base[i] if i < len(base) else 0
                  t = target[i] if i < len(target) else 0
                  if b == t or i - start >= 0xFFFF:
                      break
                  i += 1

              if start == 0x454F46:
                  start -= 1

              data = target[start:i]
              if not data:
                  i += 1
                  continue

              patch.extend(start.to_bytes(3, "big"))
              patch.extend(len(data).to_bytes(2, "big"))
              patch.extend(data)

          patch.extend(b"EOF")
          if len(target) != len(base):
              patch.extend(len(target).to_bytes(3, "big"))

          out.write_bytes(patch)
          PY

      - name: Record checksums
        run: |
          sha1sum vanilla/pokefirered_es.gba | tee baseline.sha1
          sha1sum modified/pokefirered_modern_es.gba | tee block2-production.sha1
          sha256sum Pokemon_Rojo_Fuego_Full_Block2_PRODUCCION.ips > block2-production-patch.sha256

      - name: Upload Block 2 MyBoy artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon_Rojo_Fuego_Full_Block2_MyBoy
          path: |
            Pokemon_Rojo_Fuego_Full_Block2_PRODUCCION.ips
            baseline.sha1
            block2-production.sha1
            block2-production-patch.sha256
          if-no-files-found: error
