name: Full Gameplay Core

on:
  push:
    branches:
      - feature/full-gameplay-core

jobs:
  build:
    name: Build Spanish modern gameplay core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Build firered_es_modern
        run: make -j2 firered_es_modern

      - name: Verify Full gameplay invariants
        run: |
          grep -q 'u8 category;' include/pokemon.h
          grep -q 'IS_MOVE_PHYSICAL' include/battle.h
          grep -q '\.category = MOVE_CATEGORY_PHYSICAL' src/data/battle_moves.h
          grep -q '\.category = MOVE_CATEGORY_SPECIAL' src/data/battle_moves.h
          grep -q '\.category = MOVE_CATEGORY_STATUS' src/data/battle_moves.h
          grep -q 'EVO_LEVEL, 36, SPECIES_ALAKAZAM' src/data/pokemon/evolution.h
          grep -q 'EVO_LEVEL, 36, SPECIES_MACHAMP' src/data/pokemon/evolution.h
          grep -q 'EVO_LEVEL, 36, SPECIES_GOLEM' src/data/pokemon/evolution.h
          grep -q 'EVO_LEVEL, 36, SPECIES_GENGAR' src/data/pokemon/evolution.h
          grep -q 'MOVE_POISON_FANG' src/data/pokemon/level_up_learnsets.h
          grep -q 'MOVE_SHADOW_PUNCH' src/data/pokemon/level_up_learnsets.h
          grep -q 'ABILITY_SYNCHRONIZE' src/wild_encounter.c
          grep -q 'VAR_FULL_LAST_REPEL' include/constants/vars.h
          grep -q 'ITEM_TM44' data/maps/CeladonCity_DepartmentStore_2F/scripts.inc
          grep -q 'ITEM_PP_UP' data/maps/CeladonCity_DepartmentStore_5F/scripts.inc

      - name: Validate approved wild encounter rates
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("src/data/wild_encounters.json").read_text())
          group = next(g for g in data["wild_encounter_groups"] if g["label"] == "gWildMonHeaders")
          encounters = {e["base_label"]: e for e in group["encounters"]}
          rates = {
              "land_mons": [20,20,10,10,10,10,5,5,4,4,1,1],
              "water_mons": [60,30,5,4,1],
              "fishing_mons": [70,30,60,20,20,40,40,15,4,1],
          }
          expected = [
              ("sRoute8_FireRed","land_mons","SPECIES_SANDSHREW",20),
              ("sRoute8_FireRed","land_mons","SPECIES_VULPIX",20),
              ("sRoute5_FireRed","land_mons","SPECIES_BELLSPROUT",25),
              ("sRoute6_FireRed","water_mons","SPECIES_SLOWPOKE",100),
              ("sVermilionCity_FireRed","fishing_mons","SPECIES_STARYU",40),
              ("sMtEmberExterior_FireRed","land_mons","SPECIES_MAGMAR",5),
              ("sSixIslandRuinValley_FireRed","land_mons","SPECIES_MARILL",10),
              ("sFourIslandIcefallCave1F_FireRed","land_mons","SPECIES_SNEASEL",5),
              ("sFiveIslandWaterLabyrinth_FireRed","fishing_mons","SPECIES_REMORAID",40),
              ("sSevenIslandTanobyRuins_FireRed","water_mons","SPECIES_MANTINE",5),
              ("sThreeIslandBerryForest_FireRed","land_mons","SPECIES_BULBASAUR",15),
              ("sThreeIslandBerryForest_FireRed","land_mons","SPECIES_IVYSAUR",5),
              ("sThreeIslandBerryForest_FireRed","land_mons","SPECIES_VENUSAUR",4),
              ("sMtEmberExterior_FireRed","land_mons","SPECIES_CHARMANDER",15),
              ("sMtEmberExterior_FireRed","land_mons","SPECIES_CHARMELEON",5),
              ("sMtEmberExterior_FireRed","land_mons","SPECIES_CHARIZARD",4),
              ("sSeafoamIslandsB1F_FireRed","land_mons","SPECIES_SQUIRTLE",15),
              ("sSeafoamIslandsB1F_FireRed","land_mons","SPECIES_WARTORTLE",5),
              ("sSeafoamIslandsB1F_FireRed","land_mons","SPECIES_BLASTOISE",4),
              ("sRoute7_FireRed","land_mons","SPECIES_EEVEE",15),
              ("sSeafoamIslandsB1F_FireRed","land_mons","SPECIES_VAPOREON",4),
              ("sPowerPlant_FireRed","land_mons","SPECIES_JOLTEON",4),
              ("sPokemonMansion1F_FireRed","land_mons","SPECIES_FLAREON",4),
              ("sFiveIslandLostCaveRoom1_FireRed","land_mons","SPECIES_MISDREAVUS",5),
              ("sFiveIslandLostCaveRoom4_FireRed","land_mons","SPECIES_MISDREAVUS",5),
              ("sFiveIslandLostCaveRoom10_FireRed","land_mons","SPECIES_MISDREAVUS",5),
              ("sSafariZoneCenter_FireRed","land_mons","SPECIES_SCYTHER",15),
              ("sSafariZoneCenter_FireRed","land_mons","SPECIES_PINSIR",15),
              ("sSafariZoneEast_FireRed","land_mons","SPECIES_KANGASKHAN",15),
              ("sSafariZoneNorth_FireRed","land_mons","SPECIES_CHANSEY",15),
              ("sSafariZoneWest_FireRed","land_mons","SPECIES_TAUROS",15),
          ]
          for label, kind, species, want in expected:
              mons = encounters[label][kind]["mons"]
              got = sum(r for m, r in zip(mons, rates[kind]) if m["species"] == species)
              assert got == want, (label, species, got, want)
          print(f"Validated {len(expected)} approved encounter rates")
          PY

      - name: Record ROM checksum
        run: sha1sum pokefirered_modern_es.gba
