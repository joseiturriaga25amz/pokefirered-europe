name: Full Gameplay Core

on:
  push:
    branches:
      - feature/full-gameplay-core

jobs:
  build:
    name: Build Spanish modern gameplay core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Build firered_es_modern
        run: make -j2 firered_es_modern

      - name: Verify Full gameplay invariants
        run: |
          grep -q 'u8 category;' include/pokemon.h
          grep -q 'IS_MOVE_PHYSICAL' include/battle.h
          grep -q '\.category = MOVE_CATEGORY_PHYSICAL' src/data/battle_moves.h
          grep -q '\.category = MOVE_CATEGORY_SPECIAL' src/data/battle_moves.h
          grep -q '\.category = MOVE_CATEGORY_STATUS' src/data/battle_moves.h
          grep -q 'EVO_LEVEL, 36, SPECIES_ALAKAZAM' src/data/pokemon/evolution.h
          grep -q 'EVO_LEVEL, 36, SPECIES_MACHAMP' src/data/pokemon/evolution.h
          grep -q 'EVO_LEVEL, 36, SPECIES_GOLEM' src/data/pokemon/evolution.h
          grep -q 'EVO_LEVEL, 36, SPECIES_GENGAR' src/data/pokemon/evolution.h
          grep -q 'MOVE_POISON_FANG' src/data/pokemon/level_up_learnsets.h
          grep -q 'MOVE_SHADOW_PUNCH' src/data/pokemon/level_up_learnsets.h
          grep -q 'ABILITY_SYNCHRONIZE' src/wild_encounter.c
          grep -q 'VAR_FULL_LAST_REPEL' include/constants/vars.h
          grep -q 'ITEM_TM44' data/maps/CeladonCity_DepartmentStore_2F/scripts.inc
          grep -q 'ITEM_PP_UP' data/maps/CeladonCity_DepartmentStore_5F/scripts.inc
          grep -q 'FLAG_FULL_ZAPDOS_KO_PENDING' data/maps/PowerPlant/scripts.inc
          grep -q 'FLAG_FULL_ARTICUNO_KO_PENDING' data/maps/SeafoamIslands_B4F/scripts.inc
          grep -q 'FLAG_FULL_MOLTRES_KO_PENDING' data/maps/MtEmber_Summit/scripts.inc
          grep -q 'FLAG_FULL_MEWTWO_KO_PENDING' data/maps/CeruleanCave_B1F/scripts.inc
          grep -q 'seteventmon SPECIES_DEOXYS, 50' data/maps/BirthIsland_Exterior/scripts.inc
          grep -q 'clearflag FLAG_LUGIA_FLEW_AWAY' data/scripts/hall_of_fame.inc
          grep -q 'clearflag FLAG_HO_OH_FLEW_AWAY' data/scripts/hall_of_fame.inc
          grep -q 'clearflag FLAG_DEOXYS_FLEW_AWAY' data/scripts/hall_of_fame.inc
          grep -q 'VAR_FULL_ROAMER_SEQUENCE' src/roamer.c
          grep -q 'return SPECIES_SUICUNE' src/roamer.c
          grep -q 'return SPECIES_RAIKOU' src/roamer.c
          grep -q 'return SPECIES_ENTEI' src/roamer.c
          grep -q 'if (gBattleOutcome == B_OUTCOME_CAUGHT)' src/battle_main.c
          grep -q 'special InitRoamer' data/maps/OneIsland_PokemonCenter_1F/scripts.inc
          grep -q 'ITEM_MYSTIC_TICKET' data/maps/OneIsland_PokemonCenter_1F/scripts.inc
          grep -q 'FLAG_ENABLE_SHIP_NAVEL_ROCK' data/maps/OneIsland_PokemonCenter_1F/scripts.inc
          grep -q 'VAR_FULL_AURORA_QUEST, 1' data/maps/OneIsland_PokemonCenter_1F/scripts.inc
          grep -q 'VAR_FULL_AURORA_QUEST, 2' data/maps/PewterCity_Museum_1F/scripts.inc
          grep -q 'ITEM_AURORA_TICKET' data/maps/OneIsland_PokemonCenter_1F/scripts.inc
          grep -q 'FLAG_ENABLE_SHIP_BIRTH_ISLAND' data/maps/OneIsland_PokemonCenter_1F/scripts.inc
          grep -q 'Full_CreateMewEventMon' src/script_pokemon_util.c
          grep -q 'MOVE_POUND, 0' src/script_pokemon_util.c
          grep -q 'MOVE_TRANSFORM, 1' src/script_pokemon_util.c
          grep -q 'MOVE_MEGA_PUNCH, 2' src/script_pokemon_util.c
          grep -q 'MOVE_METRONOME, 3' src/script_pokemon_util.c
          grep -q 'MON_DATA_MODERN_FATEFUL_ENCOUNTER' src/script_pokemon_util.c
          grep -q 'Full_CreateCelebiEventMon' src/script_pokemon_util.c
          grep -q 'MOVE_PSYCHIC, 0' src/script_pokemon_util.c
          grep -q 'MOVE_ANCIENT_POWER, 1' src/script_pokemon_util.c
          grep -q 'MOVE_RECOVER, 2' src/script_pokemon_util.c
          grep -q 'MOVE_HEAL_BELL, 3' src/script_pokemon_util.c
          grep -q 'VAR_FULL_ROAMER_SEQUENCE, 3' data/maps/ThreeIsland_BerryForest/scripts.inc
          grep -q 'ThreeIsland_BerryForest_EventScript_FullCelebiTree' data/maps/ThreeIsland_BerryForest/map.json
          grep -q 'goto EventScript_CutTree' data/maps/ThreeIsland_BerryForest/scripts.inc
          grep -q 'FLAG_FULL_MEW_KO_PENDING' data/scripts/hall_of_fame.inc
          grep -q 'FLAG_FULL_CELEBI_KO_PENDING' data/scripts/hall_of_fame.inc
          grep -q 'BoxPokemonSizeMustRemainGen3Compatible' include/pokemon.h
          grep -q 'PokemonSizeMustRemainGen3Compatible' include/pokemon.h
          grep -q 'species2\[monIdx\] == SPECIES_EGG' src/trade.c
          grep -q 'species2\[monIdx\] > KANTO_SPECIES_END' src/trade.c
          grep -q 'MON_DATA_MODERN_FATEFUL_ENCOUNTER' src/trade.c
          grep -q 'gSaveBlock1Ptr->roamer.species != species' src/wild_pokemon_area.c
          grep -q 'FLAG_GET_SEEN' src/wild_pokemon_area.c
          grep -q 'showFullEvView' src/pokemon_summary_screen.c
          grep -q 'MON_DATA_HP_EV' src/pokemon_summary_screen.c
          grep -q 'MON_DATA_SPEED_EV' src/pokemon_summary_screen.c
          grep -q 'MAX. STAT 252 / TOTAL 510' src/pokemon_summary_screen.c
          # Frozen bugfix audit (BUG-001..012 relevant source invariants)
          grep -q 'u32 ivs = data\[0\].*data\[1\].*data\[2\].*data\[3\]' src/pokemon.c
          grep -q 'if (gBattleOutcome == B_OUTCOME_CAUGHT)' src/battle_main.c
          grep -q 'status = ROAMER->status' src/roamer.c
          grep -q 'FISH_WILD_COUNT' src/wild_pokemon_area.c
          grep -q 'species2\[monIdx\] == SPECIES_EGG' src/trade.c
          grep -q 'if (currentHP <= 0)' src/pokemon.c
          grep -q 'spriteIds\[1\] = CreateSprite' src/learn_move.c
          grep -q 'gMain.heldKeysRaw == keyInput' src/main.c
          grep -q 'gMain.newAndRepeatedKeys |= A_BUTTON' src/main.c
          grep -q 'Free(sSlot1TilemapBuffer)' src/party_menu.c
          grep -q 'Free(sSlot2TilemapBuffer)' src/party_menu.c
          grep -q '#define field sparkleAmount' src/berry_crush.c
          grep -q '#define UBFIX' include/config.h
          test "$(grep -c 'LOCALID_RUBY' data/maps/MtEmber_RubyPath_B3F/map.json)" -eq 0
          test "$(grep -c 'LOCALID_RUBY' data/maps/MtEmber_RubyPath_B5F/map.json)" -eq 1

      - name: Validate direct trade-item evolutions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("src/data/items.json").read_text())["items"]
          by_id = {x["itemId"]: x for x in data}
          for item_id in ("ITEM_METAL_COAT","ITEM_DRAGON_SCALE","ITEM_UP_GRADE","ITEM_KINGS_ROCK"):
              item = by_id[item_id]
              assert item["fieldUseFunc"] == "FieldUseFunc_EvoItem", item_id
              assert item["type"] == "ITEM_TYPE_PARTY_MENU", (item_id, item["type"])

          evo = Path("src/pokemon.c").read_text()
          assert "gEvolutionTable[species][i].method == EVO_TRADE_ITEM" in evo
          assert "gEvolutionTable[species][i].param == evolutionItem" in evo
          print("Direct trade-item evolution UI path validated")
          PY

      - name: Validate approved wild encounter rates
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("src/data/wild_encounters.json").read_text())
          group = next(g for g in data["wild_encounter_groups"] if g["label"] == "gWildMonHeaders")
          encounters = {e["base_label"]: e for e in group["encounters"]}
          rates = {
              "land_mons": [20,20,10,10,10,10,5,5,4,4,1,1],
              "water_mons": [60,30,5,4,1],
              "fishing_mons": [70,30,60,20,20,40,40,15,4,1],
          }
          expected = [
              ("sRoute8_FireRed","land_mons","SPECIES_SANDSHREW",20),
              ("sRoute8_FireRed","land_mons","SPECIES_VULPIX",20),
              ("sRoute5_FireRed","land_mons","SPECIES_BELLSPROUT",25),
              ("sRoute6_FireRed","water_mons","SPECIES_SLOWPOKE",100),
              ("sVermilionCity_FireRed","fishing_mons","SPECIES_STARYU",40),
              ("sMtEmberExterior_FireRed","land_mons","SPECIES_MAGMAR",5),
              ("sSixIslandRuinValley_FireRed","land_mons","SPECIES_MARILL",10),
              ("sFourIslandIcefallCave1F_FireRed","land_mons","SPECIES_SNEASEL",5),
              ("sFiveIslandWaterLabyrinth_FireRed","fishing_mons","SPECIES_REMORAID",40),
              ("sSevenIslandTanobyRuins_FireRed","water_mons","SPECIES_MANTINE",5),
              ("sThreeIslandBerryForest_FireRed","land_mons","SPECIES_BULBASAUR",15),
              ("sThreeIslandBerryForest_FireRed","land_mons","SPECIES_IVYSAUR",5),
              ("sThreeIslandBerryForest_FireRed","land_mons","SPECIES_VENUSAUR",4),
              ("sMtEmberExterior_FireRed","land_mons","SPECIES_CHARMANDER",15),
              ("sMtEmberExterior_FireRed","land_mons","SPECIES_CHARMELEON",5),
              ("sMtEmberExterior_FireRed","land_mons","SPECIES_CHARIZARD",4),
              ("sSeafoamIslandsB1F_FireRed","land_mons","SPECIES_SQUIRTLE",15),
              ("sSeafoamIslandsB1F_FireRed","land_mons","SPECIES_WARTORTLE",5),
              ("sSeafoamIslandsB1F_FireRed","land_mons","SPECIES_BLASTOISE",4),
              ("sRoute7_FireRed","land_mons","SPECIES_EEVEE",15),
              ("sSeafoamIslandsB1F_FireRed","land_mons","SPECIES_VAPOREON",4),
              ("sPowerPlant_FireRed","land_mons","SPECIES_JOLTEON",4),
              ("sPokemonMansion1F_FireRed","land_mons","SPECIES_FLAREON",4),
              ("sFiveIslandLostCaveRoom1_FireRed","land_mons","SPECIES_MISDREAVUS",5),
              ("sFiveIslandLostCaveRoom4_FireRed","land_mons","SPECIES_MISDREAVUS",5),
              ("sFiveIslandLostCaveRoom10_FireRed","land_mons","SPECIES_MISDREAVUS",5),
              ("sSafariZoneCenter_FireRed","land_mons","SPECIES_SCYTHER",15),
              ("sSafariZoneCenter_FireRed","land_mons","SPECIES_PINSIR",15),
              ("sSafariZoneEast_FireRed","land_mons","SPECIES_KANGASKHAN",15),
              ("sSafariZoneNorth_FireRed","land_mons","SPECIES_CHANSEY",15),
              ("sSafariZoneWest_FireRed","land_mons","SPECIES_TAUROS",15),
          ]
          for label, kind, species, want in expected:
              mons = encounters[label][kind]["mons"]
              got = sum(r for m, r in zip(mons, rates[kind]) if m["species"] == species)
              assert got == want, (label, species, got, want)
          print(f"Validated {len(expected)} approved encounter rates")
          PY

      - name: Validate frozen Gary and boss rosters
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          text = Path("src/data/trainer_parties.h").read_text()
          trainers_json = json.loads(Path("src/data/trainers.json").read_text())
          trainers = trainers_json.get("trainers", trainers_json)
          by_id = {t["id"]: t for t in trainers}

          def block(name):
              m = re.search(r"static const struct [^ ]+ " + re.escape(name) + r"\[\] = \{(.*?)\n\};", text, re.S)
              assert m, name
              return m.group(1)

          def roster(name):
              body = block(name)
              return [(m.group(1), int(m.group(2))) for m in re.finditer(
                  r"\.lvl = (\d+),\s*\.species = SPECIES_([A-Z0-9_]+),", body
              )]

          # regex returns level/species groups in reverse construction below
          def normalized(name):
              body = block(name)
              out=[]
              for m in re.finditer(r"\.lvl = (\d+),\s*\.species = SPECIES_([A-Z0-9_]+),", body):
                  out.append((m.group(2), int(m.group(1))))
              return out

          gary = {
              "sParty_RivalOaksLabSquirtle":[("SQUIRTLE",5)],
              "sParty_RivalRoute22EarlySquirtle":[("PIDGEY",10),("SQUIRTLE",12)],
              "sParty_RivalCeruleanSquirtle":[("ABRA",18),("RATTATA",19),("PIDGEOTTO",20),("SQUIRTLE",22)],
              "sParty_RivalSsAnneSquirtle":[("KRABBY",24),("PIDGEOTTO",25),("KADABRA",25),("WARTORTLE",28)],
              "sParty_RivalPokemonTowerSquirtle":[("EXEGGCUTE",30),("PIDGEOTTO",31),("GROWLITHE",31),("KADABRA",32),("WARTORTLE",34)],
              "sParty_RivalSilphSquirtle":[("EXEGGUTOR",43),("PIDGEOT",44),("GROWLITHE",44),("ALAKAZAM",46),("BLASTOISE",49)],
              "sParty_RivalRoute22LateSquirtle":[("RHYHORN",56),("PIDGEOT",56),("NIDOKING",57),("ALAKAZAM",58),("ARCANINE",59),("BLASTOISE",61)],
              "sParty_ChampionFirstSquirtle":[("PIDGEOT",64),("ALAKAZAM",65),("NIDOKING",65),("RHYDON",66),("ARCANINE",67),("BLASTOISE",69)],
              "sParty_ChampionRematchSquirtle":[("NIDOQUEEN",80),("MAGMAR",80),("GOLEM",81),("SCIZOR",82),("ARCANINE",83),("BLASTOISE",85)],
          }
          for name, want in gary.items():
              assert normalized(name) == want, (name, normalized(name), want)
              for suffix in ("Bulbasaur","Charmander"):
                  other = name.replace("Squirtle", suffix)
                  assert re.sub(r"\s+"," ",block(other)).strip() == re.sub(r"\s+"," ",block(name)).strip(), other

          bosses = {
              "sParty_LeaderBrock":[("GEODUDE",14),("ONIX",17)],
              "sParty_LeaderMisty":[("GOLDEEN",21),("STARYU",23),("STARMIE",26)],
              "sParty_LeaderLtSurge":[("VOLTORB",25),("PIKACHU",26),("RAICHU",30)],
              "sParty_LeaderErika":[("TANGELA",31),("WEEPINBELL",32),("VILEPLUME",33),("GLOOM",35)],
              "sParty_LeaderKoga":[("VENOMOTH",40),("GOLBAT",41),("MUK",43),("WEEZING",46)],
              "sParty_LeaderSabrina":[("MR_MIME",42),("VENOMOTH",43),("KADABRA",45),("ALAKAZAM",47)],
              "sParty_LeaderBlaine":[("NINETALES",47),("RHYDON",48),("RAPIDASH",49),("ARCANINE",50),("MAGMAR",52)],
              "sParty_LeaderGiovanni":[("PERSIAN",50),("KINGLER",51),("NIDOQUEEN",52),("NIDOKING",53),("GOLEM",54),("RHYDON",56)],
              "sParty_EliteFourLorelei":[("DEWGONG",57),("SLOWBRO",58),("JYNX",59),("CLOYSTER",60),("LAPRAS",61)],
              "sParty_EliteFourBruno":[("ONIX",58),("HITMONCHAN",59),("HITMONLEE",60),("ONIX",60),("MACHAMP",62)],
              "sParty_EliteFourAgatha":[("HAUNTER",59),("GENGAR",60),("GOLBAT",60),("ARBOK",61),("GENGAR",63)],
              "sParty_EliteFourLance":[("GYARADOS",61),("DRAGONAIR",61),("DRAGONAIR",62),("AERODACTYL",63),("DRAGONITE",65)],
          }
          for name,want in bosses.items():
              assert normalized(name)==want, (name, normalized(name), want)

          rematches = {
              "sParty_RSAromaLady":[("VULPIX",60),("CROBAT",61),("FORRETRESS",62),("LUDICOLO",63),("MARSHTOMP",64),("STEELIX",66)],
              "sParty_RSRuinManiac":[("CORSOLA",61),("LUVDISC",62),("POLITOED",63),("TOGETIC",63),("STARMIE",65),("GYARADOS",67)],
              "sParty_RSTuberF":[("ELECTRODE",64),("MAGNETON",65),("ELECTABUZZ",66),("RAICHU",69)],
              "sParty_RSTuberM":[("TANGELA",62),("JUMPLUFF",63),("BELLOSSOM",64),("VICTREEBEL",65),("VILEPLUME",66),("VILEPLUME",69)],
              "sParty_RSCooltrainerM":[("ARIADOS",64),("FORRETRESS",65),("VENOMOTH",65),("MUK",67),("WEEZING",68),("CROBAT",71)],
              "sParty_RSCooltrainerF":[("VENOMOTH",65),("MR_MIME",65),("KADABRA",66),("ESPEON",68),("GENGAR",69),("ALAKAZAM",72)],
              "sParty_RSLady":[("NINETALES",66),("RAPIDASH",67),("ARCANINE",68),("MAGCARGO",68),("RHYDON",70),("MAGMAR",73)],
              "sParty_RSBeauty":[("PERSIAN",67),("CLOYSTER",68),("MACHAMP",69),("NIDOQUEEN",70),("NIDOKING",71),("RHYDON",74)],
          }
          for name,want in rematches.items():
              assert normalized(name)==want, (name, normalized(name), want)

          rematch_healing = {
              "TRAINER_RS_AROMA_LADY":"ITEM_HYPER_POTION, ITEM_HYPER_POTION",
              "TRAINER_RS_RUIN_MANIAC":"ITEM_HYPER_POTION, ITEM_HYPER_POTION",
              "TRAINER_RS_TUBER_F":"ITEM_HYPER_POTION, ITEM_HYPER_POTION",
              "TRAINER_RS_TUBER_M":"ITEM_HYPER_POTION, ITEM_HYPER_POTION",
              "TRAINER_RS_COOLTRAINER_M":"ITEM_FULL_RESTORE, ITEM_FULL_RESTORE",
              "TRAINER_RS_COOLTRAINER_F":"ITEM_FULL_RESTORE, ITEM_FULL_RESTORE",
              "TRAINER_RS_LADY":"ITEM_FULL_RESTORE, ITEM_FULL_RESTORE",
              "TRAINER_RS_BEAUTY":"ITEM_FULL_RESTORE, ITEM_FULL_RESTORE",
          }
          for tid,items in rematch_healing.items():
              assert by_id[tid]["items"] == items, (tid, by_id[tid]["items"], items)

          for tid in ("TRAINER_CHAMPION_FIRST_SQUIRTLE","TRAINER_CHAMPION_FIRST_BULBASAUR","TRAINER_CHAMPION_FIRST_CHARMANDER",
                      "TRAINER_CHAMPION_REMATCH_SQUIRTLE","TRAINER_CHAMPION_REMATCH_BULBASAUR","TRAINER_CHAMPION_REMATCH_CHARMANDER"):
              assert by_id[tid]["items"] == "ITEM_FULL_RESTORE, ITEM_FULL_RESTORE", tid

          # ECO-008: the Resort Gorgeous VS Seeker circuit relies on all three
          # wealthy trainers paying at the Lady rate. Celina was Painter in vanilla.
          for tid in ("TRAINER_LADY_JACKI","TRAINER_LADY_GILLIAN","TRAINER_PAINTER_CELINA"):
              assert by_id[tid]["trainerClass"] == "TRAINER_CLASS_LADY", (tid, by_id[tid]["trainerClass"])

          print("Frozen Gary, bosses and Resort Gorgeous payout identities validated")
          PY

      - name: Validate Full trainer legality
        run: python3 tools/validate_full_trainer_sets.py

      - name: Record ROM checksum
        run: sha1sum pokefirered_modern_es.gba
