name: Full Production Block 1

on:
  push:
    branches:
      - feature/baseline-toolchain
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  baseline-spanish:
    name: Verify Spanish vanilla baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen baseline
        uses: actions/checkout@v4
        with:
          ref: e184c5cf898cd29efebd33bc1bfe5994277e21ab
          fetch-depth: 0

      - name: Checkout agbcc
        uses: actions/checkout@v4
        with:
          repository: pret/agbcc
          path: agbcc

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Install agbcc
        working-directory: agbcc
        run: |
          ./build.sh
          ./install.sh ../

      - name: Compare Spanish FireRed
        run: make -j2 compare_firered_es

      - name: Verify documented SHA-1
        run: grep -qi '^AB8F6BFE0CCDAF41188CD015C8C74C314D02296A[[:space:]]' firered_es.sha1

      - name: Create immutable baseline tag if absent
        if: github.event_name == 'push'
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/baseline-spanish-vanilla >/dev/null 2>&1; then
            echo "baseline-spanish-vanilla already exists"
          else
            git tag baseline-spanish-vanilla e184c5cf898cd29efebd33bc1bfe5994277e21ab
            git push origin refs/tags/baseline-spanish-vanilla
          fi

  spanish-modern:
    name: Build Spanish modern head
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Build firered_es_modern
        run: make -j2 firered_es_modern


  package-myboy-smoke-patch:
    name: Package MyBoy smoke-test patch
    needs:
      - baseline-spanish
      - spanish-modern
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          path: modified

      - name: Checkout frozen Spanish baseline
        uses: actions/checkout@v4
        with:
          ref: e184c5cf898cd29efebd33bc1bfe5994277e21ab
          path: vanilla

      - name: Checkout agbcc for baseline
        uses: actions/checkout@v4
        with:
          repository: pret/agbcc
          path: vanilla/agbcc

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Install agbcc in baseline tree
        working-directory: vanilla/agbcc
        run: |
          ./build.sh
          ./install.sh ../

      - name: Build and verify Spanish vanilla base
        working-directory: vanilla
        run: make -j2 compare_firered_es

      - name: Build current Spanish modern ROM
        working-directory: modified
        run: make -j2 firered_es_modern

      - name: Create IPS patch for MyBoy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          base_path = Path("vanilla/pokefirered_es.gba")
          mod_path = Path("modified/pokefirered_es.gba")
          out_path = Path("Pokemon_Rojo_Fuego_Full_Block1_MyBoy.ips")

          base = base_path.read_bytes()
          mod = mod_path.read_bytes()

          if len(base) > 0x1000000 or len(mod) > 0x1000000:
              raise SystemExit("IPS packaging only supports addresses below 16 MiB for this project.")

          patch = bytearray(b"PATCH")
          i = 0
          limit = max(len(base), len(mod))

          while i < limit:
              b = base[i] if i < len(base) else 0
              m = mod[i] if i < len(mod) else 0
              if b == m:
                  i += 1
                  continue

              start = i
              while i < limit:
                  b = base[i] if i < len(base) else 0
                  m = mod[i] if i < len(mod) else 0
                  if b == m or i - start >= 0xFFFF:
                      break
                  i += 1

              # IPS uses the three bytes 'EOF' as its terminator, so avoid
              # emitting a record whose offset equals 0x454F46.
              if start == 0x454F46:
                  start -= 1

              data = mod[start:i]
              if not data:
                  i += 1
                  continue

              patch.extend(start.to_bytes(3, "big"))
              patch.extend(len(data).to_bytes(2, "big"))
              patch.extend(data)

          patch.extend(b"EOF")
          if len(mod) != len(base):
              patch.extend(len(mod).to_bytes(3, "big"))

          out_path.write_bytes(patch)
          print(f"base={len(base)} bytes modified={len(mod)} bytes patch={len(patch)} bytes")
          PY

      - name: Record patch checksums
        run: |
          sha1sum vanilla/pokefirered_es.gba
          sha1sum modified/pokefirered_es.gba
          sha256sum Pokemon_Rojo_Fuego_Full_Block1_MyBoy.ips | tee Pokemon_Rojo_Fuego_Full_Block1_MyBoy.sha256

      - name: Upload MyBoy IPS patch
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon_Rojo_Fuego_Full_Block1_MyBoy
          path: |
            Pokemon_Rojo_Fuego_Full_Block1_MyBoy.ips
            Pokemon_Rojo_Fuego_Full_Block1_MyBoy.sha256
          if-no-files-found: error
